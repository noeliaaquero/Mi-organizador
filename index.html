<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi organizador</title>
<style>
:root{--bg:#faf9f7;--card:#fff;--tx:#2a2a28;--mut:#8b8982;--line:#ebe9e4;--ac:#6c8f7b;--acs:#e6efe9;--late:#c0735a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#201f1e;--tx:#ecebe7;--mut:#8f8d86;--line:#2e2d2b;--ac:#86ad94;--acs:#26322b;--late:#d98a70}}
:root[data-theme="dark"]{--bg:#171716;--card:#201f1e;--tx:#ecebe7;--mut:#8f8d86;--line:#2e2d2b;--ac:#86ad94;--acs:#26322b;--late:#d98a70}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:22px}
h1{font-size:1.5rem;font-weight:600;margin:0;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:.9rem}
.seg{display:flex;background:var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;color:var(--mut);padding:6px 16px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.08)}
form{display:flex;flex-wrap:wrap;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:22px}
form input{font:inherit;color:var(--tx);background:none;border:0;outline:0;padding:8px 10px;min-width:0}
#t{flex:1 1 220px}
#d,#h{border-left:1px solid var(--line);color:var(--mut);font-size:.9rem}
form button{border:0;background:var(--ac);color:#fff;font:inherit;padding:8px 20px;border-radius:12px;cursor:pointer}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.nav b{font-weight:600;text-transform:capitalize}
.nav button{border:1px solid var(--line);background:var(--card);color:var(--tx);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1rem}
.nav .hoy{width:auto;padding:0 14px;border-radius:999px;font-size:.85rem;margin:0 8px}
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:130px}
.day.today{border-color:var(--ac)}
.day h3{margin:0 0 8px;font-size:.8rem;font-weight:500;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.day h3 span{color:var(--tx);font-size:1.1rem;font-weight:600;margin-left:4px}
.task{display:flex;gap:10px;align-items:flex-start;padding:5px 0;transition:opacity .4s,transform .4s,max-height .4s;max-height:80px}
.task.gone{opacity:0;transform:translateX(14px);max-height:0;overflow:hidden}
.task input{appearance:none;flex:none;width:19px;height:19px;margin:3px 0 0;border:1.6px solid var(--c,var(--mut));border-radius:50%;cursor:pointer;display:grid;place-content:center}
.task input:checked{background:var(--c,var(--ac));border-color:var(--c,var(--ac))}
.task input:checked::after{content:"✓";color:#fff;font-size:.7rem}
.task label{flex:1;word-break:break-word;font-size:.95rem}
.task small{display:block;color:var(--mut);font-size:.75rem}
.task.late small{color:var(--late)}
.task .x{border:0;background:none;color:var(--mut);cursor:pointer;opacity:0;font-size:1rem;line-height:1}
.task:hover .x{opacity:1}
@media (hover:none){.task .x{opacity:.5}}
.pal{display:flex;gap:7px;align-items:center;padding:0 8px;border-left:1px solid var(--line)}
.pal i{width:18px;height:18px;border-radius:50%;cursor:pointer;opacity:.55;transition:transform .15s,opacity .15s}
.pal i.on{opacity:1;transform:scale(1.2);box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--mut)}
.task .cd{flex:none;width:10px;height:10px;border-radius:50%;border:0;padding:0;margin-top:9px;background:var(--c);cursor:pointer;opacity:.8}
.gr{flex:none;color:var(--mut);cursor:grab;touch-action:none;opacity:0;font-size:.8rem;line-height:1.7;user-select:none;padding:0 2px}
.task:hover .gr{opacity:.6}
@media (hover:none){.gr{opacity:.5}}
.task{touch-action:pan-y}
body.drag{user-select:none;cursor:grabbing}
.ghost{position:fixed;pointer-events:none;z-index:30;background:var(--card);border:1px solid var(--ac);border-radius:12px;padding:8px 12px;box-shadow:0 8px 28px rgba(0,0,0,.18);max-width:240px;font-size:.95rem}
.over{outline:2px dashed var(--ac);outline-offset:-2px;background:var(--acs)}
.qa{width:100%;border:0;border-top:1px dashed var(--line);background:none;color:var(--tx);font:inherit;font-size:.9rem;padding:8px 0 2px;margin-top:6px;outline:0}
.qa::placeholder{color:var(--mut)}
.empty{color:var(--mut);font-size:.85rem;opacity:.7}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{text-align:center;font-size:.75rem;color:var(--mut);text-transform:uppercase;padding-bottom:4px}
.cell{aspect-ratio:1/1;max-height:84px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;font-size:.9rem}
.cell.out{opacity:.35}
.cell.today{border-color:var(--ac)}
.cell.sel{background:var(--acs);border-color:var(--ac)}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ac)}
.panel{margin-top:18px}
.panel .day{min-height:0}
#toasts{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:20;max-width:calc(100% - 28px)}
.toast{background:var(--tx);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:.9rem;box-shadow:0 6px 24px rgba(0,0,0,.2);cursor:pointer}
#auth{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#auth[hidden]{display:none}
.box{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.box h2{margin:0;font-size:1.6rem;font-weight:600;letter-spacing:-.02em}
.box input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:0}
.box button{font:inherit;border:0;border-radius:12px;padding:11px;background:var(--ac);color:#fff;cursor:pointer}
.box button.alt{background:none;color:var(--ac);border:1px solid var(--line)}
.who{display:flex;gap:10px;align-items:center;font-size:.8rem;color:var(--mut)}
.who button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:4px 12px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Mi organizador</h1><div class="sub" id="sub"></div></div>
  <div class="seg"><button id="bw" class="on">Semana</button><button id="bm">Mes</button></div>
  <div class="who" id="who" hidden><span id="mail"></span><button id="out">Salir</button></div>
</header>
<form id="f" autocomplete="off">
  <input id="t" placeholder="¿Qué tienes que hacer?" required>
  <input id="d" type="date" required>
  <input id="h" type="time" title="Hora del recordatorio (opcional)">
  <div class="pal" id="pal" title="Color de la tarea"></div>
  <button>Añadir</button>
</form>
<div class="nav"><div><button id="pv">‹</button><button class="hoy" id="hy">Hoy</button><button id="nx">›</button></div><b id="lab"></b></div>
<div id="main"></div>
</div>
<div id="auth" hidden><div class="box"><h2>Mi organizador</h2><p class="sub">Entra para tener tus tareas en todos tus dispositivos</p><input id="em" type="email" placeholder="Correo" autocomplete="email"><input id="pw" type="password" placeholder="Contraseña (mínimo 6 caracteres)" autocomplete="current-password"><button id="li">Entrar</button><button id="su" class="alt">Crear cuenta</button><p id="am" class="sub"></p></div></div>
<div id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
var SUPABASE_URL="PEGA_AQUI_TU_URL",SUPABASE_KEY="PEGA_AQUI_TU_CLAVE";
var sb=null,uid=null,tasks=[],view="week",anchor=new Date(),sel="",st=null;
var online=SUPABASE_URL.indexOf("http")===0&&!!window.supabase;
try{tasks=JSON.parse(localStorage.getItem("tareas")||"[]")}catch(e){tasks=[]}
function warn(t){var el=document.createElement("div");el.className="toast";el.textContent=t;el.onclick=function(){el.remove()};document.getElementById("toasts").appendChild(el);setTimeout(function(){el.remove()},6000)}
function save(){
  try{localStorage.setItem("tareas",JSON.stringify(tasks))}catch(e){}
  if(!sb||!uid)return;
  clearTimeout(st);st=setTimeout(push,400);
}
function push(){sb.from("agenda").upsert({user_id:uid,data:tasks,updated_at:new Date().toISOString()}).then(function(r){if(r.error)warn("No se pudo sincronizar")})}
function pull(){return sb.from("agenda").select("data").eq("user_id",uid).maybeSingle().then(function(r){
  if(r.error){warn("No se pudo cargar tus tareas");return}
  if(r.data&&r.data.data){tasks=r.data.data}else if(tasks.length){push()}
  try{localStorage.setItem("tareas",JSON.stringify(tasks))}catch(e){}
  render();
})}
function iso(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function parse(s){var p=s.split("-");return new Date(+p[0],p[1]-1,+p[2])}
var todayS=iso(new Date());sel=todayS;
var $=function(i){return document.getElementById(i)};
$("d").value=todayS;
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function mondayOf(d){var x=new Date(d);var w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}
var COL=["#6c8f7b","#6b8cae","#d4a85a","#c9776b","#9a84b5"],cur=0;
function taskHTML(t){
  var late=t.d<todayS;
  var meta=(late?"Atrasada · ":"")+(t.h?"⏰ "+t.h:"");
  return '<div class="task'+(late?" late":"")+'" data-id="'+t.id+'" style="--c:'+COL[t.c||0]+'"><input type="checkbox"><label>'+esc(t.t)+(meta?"<small>"+meta+"</small>":"")+'</label><span class="gr" title="Arrastrar a otro día">⋮⋮</span><button class="cd" title="Cambiar color"></button><button class="x" title="Borrar">×</button></div>';
}
function listFor(ds){
  var l=tasks.filter(function(t){return t.d===ds}).sort(function(a,b){return (a.h||"99")<(b.h||"99")?-1:1});
  return l.length?l.map(taskHTML).join(""):'<div class="empty">Nada por aquí</div>';
}
function dayCard(d){
  var ds=iso(d),n=d.toLocaleDateString("es-ES",{weekday:"short"}).replace(".","");
  return '<div class="day'+(ds===todayS?" today":"")+'" data-day="'+ds+'"><h3 data-d="'+ds+'">'+n+'<span>'+d.getDate()+'</span></h3>'+listFor(ds)+'<input class="qa" data-qa="'+ds+'" placeholder="+ Añadir" enterkeyhint="done" autocomplete="off"></div>';
}
function render(){
  $("bw").className=view==="week"?"on":"";$("bm").className=view==="month"?"on":"";
  var open=tasks.length,h="";
  $("sub").textContent=open?(open===1?"1 tarea pendiente":open+" tareas pendientes"):"Todo al día ✨";
  if(view==="week"){
    var m=mondayOf(anchor),e=new Date(m);e.setDate(e.getDate()+6);
    $("lab").textContent=m.getDate()+" "+m.toLocaleDateString("es-ES",{month:"short"})+" – "+e.getDate()+" "+e.toLocaleDateString("es-ES",{month:"short",year:"numeric"});
    h='<div class="week">';
    for(var i=0;i<7;i++){var d=new Date(m);d.setDate(m.getDate()+i);h+=dayCard(d)}
    h+="</div>";
  }else{
    $("lab").textContent=anchor.toLocaleDateString("es-ES",{month:"long",year:"numeric"});
    var first=new Date(anchor.getFullYear(),anchor.getMonth(),1),s=mondayOf(first);
    h='<div class="month">'+["L","M","X","J","V","S","D"].map(function(w){return '<div class="wd">'+w+'</div>'}).join("");
    for(var j=0;j<42;j++){
      var c=new Date(s);c.setDate(s.getDate()+j);var cs=iso(c);
      var n=tasks.filter(function(t){return t.d===cs}).length;
      var dots="";tasks.filter(function(t){return t.d===cs}).slice(0,6).forEach(function(t){dots+='<i style="background:'+COL[t.c||0]+'"></i>'});
      h+='<div class="cell'+(c.getMonth()!==anchor.getMonth()?" out":"")+(cs===todayS?" today":"")+(cs===sel?" sel":"")+'" data-d="'+cs+'" data-day="'+cs+'"><span>'+c.getDate()+'</span><div class="dots">'+dots+'</div></div>';
      if(j===34&&c.getMonth()!==anchor.getMonth()&&new Date(c.getTime()+864e5).getMonth()!==anchor.getMonth()){break}
    }
    h+='</div><div class="panel">'+dayCard(parse(sel))+"</div>";
  }
  $("main").innerHTML=h;
}
$("f").onsubmit=function(e){
  e.preventDefault();
  var t=$("t").value.trim();if(!t)return;
  tasks.push({id:Date.now()+Math.random(),t:t,d:$("d").value,h:$("h").value,n:false,c:cur});
  var hasH=!!$("h").value;
  save();$("t").value="";$("h").value="";
  if(hasH&&window.Notification&&Notification.permission==="default"){try{Notification.requestPermission()}catch(x){}}
  render();
};
$("h").onchange=function(){try{if(window.Notification&&Notification.permission==="default")Notification.requestPermission()}catch(x){}};
function remove(id){tasks=tasks.filter(function(t){return t.id!==id});save();render()}
$("main").onclick=function(e){
  var tk=e.target.closest(".task");
  if(tk){
    var id=+tk.dataset.id;
    if(e.target.classList.contains("cd")){var t0=tasks.filter(function(t){return t.id===id})[0];if(t0){t0.c=((t0.c||0)+1)%COL.length;save();render()}return}
    if(e.target.classList.contains("x")){remove(id);return}
    if(e.target.tagName==="INPUT"){tk.classList.add("gone");setTimeout(function(){remove(id)},450);return}
  }
  if(tk||e.target.classList.contains("qa"))return;
  var d=e.target.closest("[data-d],[data-day]");
  if(d){sel=d.dataset.d||d.dataset.day;$("d").value=sel;if(view==="month")render();var q=document.querySelector('[data-qa="'+sel+'"]');if(q)q.focus()}
};
function drawPal(){$("pal").innerHTML=COL.map(function(c,i){return '<i data-c="'+i+'" class="'+(i===cur?"on":"")+'" style="background:'+c+'"></i>'}).join("")}
$("pal").onclick=function(e){if(e.target.dataset.c){cur=+e.target.dataset.c;drawPal()}};
drawPal();
$("bw").onclick=function(){view="week";render()};
$("bm").onclick=function(){view="month";render()};
function step(n){
  if(view==="week")anchor.setDate(anchor.getDate()+7*n);else{anchor.setDate(1);anchor.setMonth(anchor.getMonth()+n)}
  render();
}
$("pv").onclick=function(){step(-1)};$("nx").onclick=function(){step(1)};
$("hy").onclick=function(){anchor=new Date();sel=todayS;$("d").value=todayS;render()};
$("main").addEventListener("keydown",function(e){
  var q=e.target;
  if(e.key!=="Enter"||!q.classList||!q.classList.contains("qa"))return;
  var t=q.value.trim();if(!t)return;
  var ds=q.dataset.qa;
  tasks.push({id:Date.now()+Math.random(),t:t,d:ds,h:"",n:false,c:cur});
  save();render();
  var n=document.querySelector('[data-qa="'+ds+'"]');if(n)n.focus();
});
var drag=null;
$("main").addEventListener("pointerdown",function(e){
  var tk=e.target.closest(".task");
  if(!tk||e.button>0||e.target.closest("input,.x,.cd"))return;
  if(e.pointerType!=="mouse"&&!e.target.classList.contains("gr"))return;
  drag={el:tk,id:+tk.dataset.id,x:e.clientX,y:e.clientY,on:false,g:null,over:null};
});
document.addEventListener("pointermove",function(e){
  if(!drag)return;
  if(!drag.on){
    if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)<8)return;
    drag.on=true;drag.el.style.opacity=".35";document.body.classList.add("drag");
    var g=document.createElement("div");g.className="ghost";g.textContent=drag.el.querySelector("label").firstChild.textContent;
    document.body.appendChild(g);drag.g=g;
  }
  drag.g.style.left=(e.clientX+12)+"px";drag.g.style.top=(e.clientY+12)+"px";
  var el=document.elementFromPoint(e.clientX,e.clientY),dz=el&&el.closest("[data-day]");
  if(drag.over&&drag.over!==dz)drag.over.classList.remove("over");
  if(dz)dz.classList.add("over");
  drag.over=dz;
});
function endDrag(ok){
  if(!drag)return;
  var d=drag;drag=null;
  if(!d.on)return;
  d.g.remove();document.body.classList.remove("drag");
  if(d.over)d.over.classList.remove("over");
  if(ok&&d.over){
    var t=tasks.filter(function(x){return x.id===d.id})[0],nd=d.over.dataset.day;
    if(t&&t.d!==nd){t.d=nd;t.n=false;save()}
  }
  render();
}
document.addEventListener("pointerup",function(){endDrag(true)});
document.addEventListener("pointercancel",function(){endDrag(false)});
function toast(msg){
  var el=document.createElement("div");el.className="toast";el.textContent="⏰ "+msg;
  el.onclick=function(){el.remove()};$("toasts").appendChild(el);
  setTimeout(function(){el.remove()},15000);
}
function check(){
  var now=new Date(),changed=false;
  tasks.forEach(function(t){
    if(t.h&&!t.n&&new Date(t.d+"T"+t.h)<=now){
      t.n=true;changed=true;toast(t.t);
      try{if(window.Notification&&Notification.permission==="granted")new Notification("Recordatorio",{body:t.t})}catch(x){}
    }
  });
  if(changed)save();
}
check();setInterval(check,20000);
render();
function showAuth(on){$("auth").hidden=!on;$("who").hidden=on}
function startSession(s){uid=s.user.id;$("mail").textContent=s.user.email;showAuth(false);pull()}
function auth(sign){
  var e=$("em").value.trim(),p=$("pw").value;
  if(!e||p.length<6){$("am").textContent="Escribe tu correo y una contraseña de 6 o más caracteres";return}
  $("am").textContent="…";
  var q=sign?sb.auth.signUp({email:e,password:p}):sb.auth.signInWithPassword({email:e,password:p});
  q.then(function(r){
    if(r.error){$("am").textContent=r.error.message;return}
    if(r.data.session)startSession(r.data.session);
    else $("am").textContent="Revisa tu correo para confirmar la cuenta y luego pulsa Entrar";
  });
}
if(online){
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.auth.getSession().then(function(r){if(r.data.session)startSession(r.data.session);else showAuth(true)});
  $("li").onclick=function(){auth(false)};$("su").onclick=function(){auth(true)};
  $("out").onclick=function(){sb.auth.signOut().then(function(){uid=null;tasks=[];try{localStorage.removeItem("tareas")}catch(e){}render();showAuth(true)})};
  document.addEventListener("visibilitychange",function(){if(!document.hidden&&uid)pull()});
}
</script>
</body>
</html>
